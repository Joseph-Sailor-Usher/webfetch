[package]
name = "webfetch"
version = "0.2.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
scraper = "0.20"
clap = { version = "4", features = ["derive", "env"] }
urlencoding = "2"
ego-tree = "0.6"
serde_json = "1"
dom_smoothie = "0.20.0"
htmd = "0.6.1"
regex = "1.13.2"
